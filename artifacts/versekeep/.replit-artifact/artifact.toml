kind = "mobile"
previewPath = "/"
title = "VerseKeep"
description = "A personal Bible verse journal for saving scripture, writing reflections, building devotion tasks, setting daily reminders, and tracking reading streaks offline-first on Android and iOS."
version = "1.0.0"
id = "artifacts/versekeep"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22535

[services.development]
run = "pnpm --filter @workspace/versekeep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/versekeep", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/versekeep", "run", "serve" ]

[services.env]
PORT = "22535"
BASE_PATH = "/"
